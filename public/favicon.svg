<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer gradient border wrapper -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  
  <!-- Inner dark slate background -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#0f172a" />
  
  <!-- Graduation Cap Icon in cyan -->
  <g fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 10)">
    <!-- Mortarboard Top -->
    <polygon points="22 6 42 16 22 26 2 16" fill="rgba(6, 182, 212, 0.15)" stroke="#67e8f9" stroke-width="3" />
    
    <!-- Cap Skullcap Underneath -->
    <path d="M7 19.5v8c0 4.5 6.7 8.5 15 8.5s15-4 15-8.5v-8" stroke="#67e8f9" stroke-width="3" />
    
    <!-- Tassel & Ribbon -->
    <path d="M38 18.5v16" stroke="#67e8f9" stroke-width="3" />
    <circle cx="38" cy="35" r="2" fill="#67e8f9" stroke="none" />
  </g>
</svg>
